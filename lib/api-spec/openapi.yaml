openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: market-signals
    description: Public remote-job listing signals
  - name: ai-insights
    description: Opt-in, server-side AI career insights
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /market-signals:
    get:
      operationId: getMarketSignals
      tags: [market-signals]
      summary: Read a cached public sample of IT-related remote job listings
      description: Returns recent listings from Remotive. The upstream feed is delayed and cached to respect its request guidance.
      responses:
        "200":
          description: Listings, a stale cache, or a clear upstream error state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSignalsResponse"
  /ai-insights:
    post:
      operationId: postAiInsights
      tags: [ai-insights]
      summary: Generate an opt-in AI career insight
      description: Sends validated career skills and short market-signal context to the configured server-side Runpod endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiInsightsRequest"
      responses:
        "202":
          description: Insight job accepted or an existing matching job reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiInsightsSubmissionResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          description: Request limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "502":
          description: The AI service returned an unusable response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: AI service is not configured or is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /ai-insights/{trackingHandle}:
    get:
      operationId: getAiInsightsStatus
      tags: [ai-insights]
      summary: Check an existing AI insight job without submitting a new one
      parameters:
        - name: trackingHandle
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current job state, including completed insight text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiInsightsJobStatusResponse"
        "404":
          description: Tracking handle is unknown or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MarketSignalItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        company:
          type: string
        category:
          type: string
        location:
          type: string
        publishedAt:
          type: string
        url:
          type: string
          format: uri
        tags:
          type: array
          items:
            type: string
      required: [id, title, company, category, location, publishedAt, url, tags]
    MarketSignalsResponse:
      type: object
      properties:
        status:
          type: string
          enum: [live, stale, error]
        sourceName:
          type: string
        sourceUrl:
          type: string
          format: uri
        fetchedAt:
          type: [string, "null"]
          format: date-time
        cacheExpiresAt:
          type: [string, "null"]
          format: date-time
        cached:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarketSignalItem"
        error:
          type: [string, "null"]
      required: [status, sourceName, sourceUrl, fetchedAt, cacheExpiresAt, cached, items, error]
    AiInsightsSkill:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        level:
          type: string
          enum: [Beginner, Intermediate, Advanced]
      required: [name, level]
    AiInsightsJobSignal:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        category:
          type: string
          maxLength: 80
        publishedAt:
          type: string
          maxLength: 40
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 40
      required: [title, category, publishedAt, tags]
    AiInsightsRequest:
      type: object
      properties:
        careerId:
          type: string
          enum:
            - software-developer
            - data-analyst
            - cybersecurity-analyst
            - cloud-network-engineer
            - ai-ml-engineer
        skills:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/AiInsightsSkill"
        skillGaps:
          type: array
          maxItems: 12
          items:
            type: string
            maxLength: 60
        jobSignals:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/AiInsightsJobSignal"
      required: [careerId, skills, skillGaps, jobSignals]
    AiInsightsSubmissionResponse:
      type: object
      properties:
        trackingHandle:
          type: string
          format: uuid
        status:
          type: string
          enum: [SUBMITTING, IN_QUEUE, IN_PROGRESS, COMPLETED, FAILED, CANCELLED, TIMED_OUT, EXPIRED, SUBMISSION_UNKNOWN]
      required: [trackingHandle, status]
    AiInsightsJobStatusResponse:
      type: object
      properties:
        trackingHandle:
          type: string
          format: uuid
        status:
          type: string
          enum: [SUBMITTING, IN_QUEUE, IN_PROGRESS, COMPLETED, FAILED, CANCELLED, TIMED_OUT, EXPIRED, SUBMISSION_UNKNOWN]
        insights:
          type: string
        generatedAt:
          type: string
          format: date-time
        model:
          type: string
        error:
          type: string
      required: [trackingHandle, status]
    ApiErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

